workflows:
  android-driver-app:
    name: Uber Driver Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Downgrade from 'stable' to a version compatible with Gradle 7.6.3
      flutter: 3.13.9 
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          cd uber_drivers_app
          flutter pub get

      - name: Clean and Build APK
        script: |
          cd uber_drivers_app
          flutter clean
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          # Use a slightly older build command compatible with 3.13.9
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - uber_drivers_app/build/app/outputs/flutter-apk/*.apk
