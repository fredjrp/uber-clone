workflows:
  android-driver-app:
    name: Uber Driver Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2 # Android builds are faster on Mac/Linux instances
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > uber_drivers_app/android/local.properties

      - name: Get Flutter packages
        script: |
          cd uber_drivers_app
          flutter pub get

      - name: Clean and Build APK
        script: |
          cd uber_drivers_app
          
          # Fix for the 45 errors you had earlier: 
          # Remove the old registrant and let Flutter recreate it fresh
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          
          # Build the APK
          # Adding --no-tree-shake-icons to prevent font errors common in clones
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

    artifacts:
      - uber_drivers_app/build/app/outputs/flutter-apk/*.apk
