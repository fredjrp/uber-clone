workflows:
  windows-admin-panel:
    name: Uber Admin Panel Windows Build
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
    scripts:
      - name: Configure Windows Desktop
        script: |
          flutter config --enable-windows-desktop

      - name: Build Windows App
        script: |
          # Navigate into your specific folder from the screenshot
          cd uber_admin_panel
          
          # Clean and fetch dependencies
          flutter pub get
          
          # Build the release executable
          flutter build windows --release --no-tree-shake-icons

    artifacts:
artifacts:
      # This searches all subdirectories for the release files
      - "**/build/windows/x64/runner/Release/*.exe"
      - "**/build/windows/x64/runner/Release/*.dll"
      - "**/build/windows/x64/runner/Release/data/**"
